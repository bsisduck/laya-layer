# Partial v1 schema for the implemented document-only slice, not the full proposal.
schema_version: 1
policy_id: document-demo
revision: 1
ingress:
  max_body_bytes: 16384
  max_json_depth: 12
  body_timeout_seconds: 5.0
documents_read:
  roles: [analyst]
  classifications: [public, internal]
output:
  max_result_bytes: 32768
  redact_emails: true
  block_synthetic_secrets: true
# Setting true makes readiness and document dispatch fail closed until a worker exists.
semantic_required: false
