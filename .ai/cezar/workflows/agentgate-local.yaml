name: agentgate-local
description: Implement one authorized AgentGate task, review locally, and validate.
steps:
  - id: implement
    name: Implement and review locally
    runner: codex
    prompt: |
      Read AGENTS.md, SDLC.md, CODE_REVIEW.md, BACKWARD_COMPATIBILITY.md,
      and the relevant sections of AgentGate_Full_Project_Architecture.md.
      Complete only this task: {{task}}
      Keep changes local and make working commits. Review the diff against
      CODE_REVIEW.md and fix findings. Run make validate and the tests appropriate
      to the changed behavior. Extend the existing lint, type, test, and build
      checks whenever introducing a new application boundary.
      Report evidence and remaining limitations. Publish only on explicit user instruction.
  - id: verify
    name: Validate the repository
    command: make validate
    onFail:
      retry: implement
      max: 2
