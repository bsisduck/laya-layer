[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "agentgate"
version = "0.1.0"
description = "Deterministic agent tool enforcement with a local audit trail"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
agentgate = "agentgate.cli:main"
agentgate-telemetry = "agentgate.telemetry_cli:main"
agentgate-agent = "agentgate.agents.direct:main"
agentgate-hermes = "agentgate.agents.hermes:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agentgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
